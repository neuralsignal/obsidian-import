name: Claude Mention Handler

on:
  issue_comment:
    types: [created]

permissions:
  contents: write
  issues: write
  pull-requests: write
  id-token: write

jobs:
  maintainer-request:
    uses: neuralsignal/agentic-engineering-kit/.github/workflows/maintainer-claude-pixi.yml@c1d65d9ec77c90350465affd2b68acca6a677fe8
    secrets:
      CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
      CLAUDE_GITHUB_TOKEN: ${{ secrets.FACTORY_PAT }}
